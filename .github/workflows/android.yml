name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # مفتاح التوقيع: من Secrets لو متسجّل (عشان التحديثات تتسطّب فوق القديم)، وإلا مفتاح مؤقت للتجربة
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_S" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KS_PASS=$KS_PASS_S" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16); echo "::add-mask::$P"; echo "KS_PASS=$P" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias itqan -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Itqan Academy, O=Itqan Academy, C=EG"
          fi
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VCODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VNAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: gradle -p android assembleRelease --no-daemon
      - name: Fingerprint (for assetlinks.json)
        run: keytool -list -v -keystore "$KS_PATH" -alias itqan -storepass "$KS_PASS" | grep -i "SHA256:" || true
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ItqanAcademy-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ItqanAcademy-Android
          path: ItqanAcademy-Android.apk
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Itqan Academy Android 1.0.${{ github.run_number }}
          make_latest: false
          body: |
            تطبيق أكاديمية إتقان للأندرويد.
            - حمّل **ItqanAcademy-Android.apk** على الموبايل وافتحه ← «تثبيت».
            - لو الموبايل طلب: اسمح بتثبيت التطبيقات من المصدر ده (Chrome / الملفات / واتساب).
            التطبيق بيفتح موقع إتقان جوه Chrome، فأي تحديث للموقع بيوصل لوحده.
          files: ItqanAcademy-Android.apk
