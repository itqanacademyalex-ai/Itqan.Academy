name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # مفتاح التوقيع من أسرار المستودع — لازم يفضل نفس المفتاح عشان التحديثات تتثبت فوق النسخة القديمة
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/itqan.jks"
            echo "ITQAN_KEYSTORE=$RUNNER_TEMP/itqan.jks" >> "$GITHUB_ENV"
            echo "ITQAN_KEYSTORE_PASS=$KP" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS secrets are missing — building with a temporary debug key (not published)."
          fi
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ItqanAcademy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ItqanAcademy-Android
          path: android/ItqanAcademy.apk
          if-no-files-found: error
      - name: Read app version
        id: ver
        run: echo "v=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Stop if not signed
        if: github.event_name == 'workflow_dispatch' && steps.key.outputs.signed != '1'
        run: |
          echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASS repository secrets before publishing."
          exit 1
      # تشغيل يدوي من Actions (Run workflow) ← ينشر الملف على رابط ثابت:
      # https://github.com/itqanacademyalex-ai/Itqan.Academy/releases/download/android-app/ItqanAcademy.apk
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          target_commitish: ${{ github.sha }}
          name: Itqan Academy Android ${{ steps.ver.outputs.v }}
          make_latest: false
          body: |
            تطبيق أكاديمية إتقان للأندرويد — الإصدار ${{ steps.ver.outputs.v }}.
            - **ItqanAcademy.apk** — نزّله وافتحه من التنزيلات.

            أول مرة: الموبايل هيطلب السماح بالتثبيت من «مصادر غير معروفة» — اسمح لـ Chrome أو مدير الملفات.
          files: android/ItqanAcademy.apk
