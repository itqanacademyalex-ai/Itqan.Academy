<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>أدوات الرسم</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:Cairo,Tahoma,"Segoe UI",sans-serif}
.bar{height:100%;display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(20,40,63,.96);border:1px solid rgba(227,192,141,.45);border-radius:16px;color:#fff;user-select:none}
.grip{-webkit-app-region:drag;cursor:move;width:18px;align-self:stretch;display:flex;align-items:center;justify-content:center;opacity:.6;font-size:16px}
button{-webkit-app-region:no-drag;width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:#27496b;color:#fff;font-size:18px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
button.on{border-color:#e3c08d;background:#1a9486}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #1a9486}
.sp{width:1px;align-self:stretch;background:rgba(255,255,255,.18);margin:4px 2px}
#x{width:auto;padding:0 12px;font-size:14px;font-weight:700;background:#d4605a}
</style>
</head>
<body>
<div class="bar">
 <div class="grip" title="اسحب لتحريك الشريط">⠿</div>
 <button data-tool="pen" title="قلم" class="on">✏️</button>
 <button data-tool="hl" title="هايلايتر">🖊</button>
 <button data-tool="era" title="ممحاة">🧽</button>
 <i class="sp"></i>
 <button class="sw on" data-c="#e5484d" style="background:#e5484d" title="أحمر"></button>
 <button class="sw" data-c="#2563eb" style="background:#2563eb" title="أزرق"></button>
 <button class="sw" data-c="#16a34a" style="background:#16a34a" title="أخضر"></button>
 <button class="sw" data-c="#facc15" style="background:#facc15" title="أصفر"></button>
 <button class="sw" data-c="#111827" style="background:#111827" title="أسود"></button>
 <button class="sw" data-c="#ffffff" style="background:#ffffff" title="أبيض"></button>
 <i class="sp"></i>
 <button data-w="2" title="رفيع"><i style="display:block;width:18px;height:2px;background:#fff;border-radius:2px"></i></button>
 <button data-w="4" title="متوسط" class="on"><i style="display:block;width:18px;height:4px;background:#fff;border-radius:2px"></i></button>
 <button data-w="8" title="سميك"><i style="display:block;width:18px;height:8px;background:#fff;border-radius:4px"></i></button>
 <i class="sp"></i>
 <button id="u" title="تراجع (Ctrl+Z)">↩</button>
 <button id="cl" title="مسح كل الرسم">🗑</button>
 <button id="x" title="إيقاف الرسم والرجوع للماوس (Esc)">🖱 رجوع للماوس</button>
</div>
<script>
/* شريط أدوات الرسم على الشاشة — مستخبي عن الطلاب (مش بيظهر في الشاشة المشاركة) */
const A=m=>window.itqanApp.ann(m),sel=(q,el)=>{document.querySelectorAll(q).forEach(b=>b.classList.toggle('on',b===el))};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{sel('[data-tool]',b);A({t:'tool',v:b.dataset.tool})});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sel('[data-c]',b);A({t:'color',v:b.dataset.c})});
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{sel('[data-w]',b);A({t:'width',v:+b.dataset.w})});
document.getElementById('u').onclick=()=>A({t:'undo'});
document.getElementById('cl').onclick=()=>A({t:'clear'});
document.getElementById('x').onclick=()=>A({t:'close'});
window.itqanApp.onAnn(m=>{if(m.t=='state'){const t=document.querySelector('[data-tool="'+m.tool+'"]');if(t)sel('[data-tool]',t)}});
addEventListener('keydown',e=>{if(e.key=='Escape')A({t:'close'})});
</script>
</body>
</html>
